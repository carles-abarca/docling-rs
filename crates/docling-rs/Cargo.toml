[package]
name = "docling-rs"
version.workspace = true
edition.workspace = true
description = "Native Rust document processing library"
license.workspace = true
repository.workspace = true

[features]
default = ["markdown", "html", "csv"]
full = ["markdown", "html", "csv", "docx", "xlsx", "pptx", "pdf"]
markdown = ["dep:docling-rs-markdown"]
html = ["dep:docling-rs-html"]
csv = ["dep:docling-rs-csv"]
docx = ["dep:docling-rs-docx"]
xlsx = ["dep:docling-rs-xlsx"]
pptx = ["dep:docling-rs-pptx"]
pdf = ["dep:docling-rs-pdf"]
ocr = ["pdf", "docling-rs-pdf?/ocr"]

[dependencies]
docling-rs-core.workspace = true
docling-rs-markdown = { workspace = true, optional = true }
docling-rs-html = { workspace = true, optional = true }
docling-rs-csv = { workspace = true, optional = true }
docling-rs-docx = { workspace = true, optional = true }
docling-rs-xlsx = { workspace = true, optional = true }
docling-rs-pptx = { workspace = true, optional = true }
docling-rs-pdf = { workspace = true, optional = true }
serde_json.workspace = true

[lib]
name = "docling_rs"
crate-type = ["rlib", "staticlib"]

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
printpdf.workspace = true
tempfile.workspace = true

[lints]
workspace = true
