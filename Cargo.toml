[workspace]
members = [
    "crates/docling-rs",
    "crates/docling-rs-core",
    "crates/docling-rs-cli",
    "crates/docling-rs-formats/markdown",
    "crates/docling-rs-formats/html",
    "crates/docling-rs-formats/csv",
    "crates/docling-rs-formats/docx",
    "crates/docling-rs-formats/xlsx",
    "crates/docling-rs-formats/pptx",
    "crates/docling-rs-formats/pdf",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["Docling-rs Contributors"]
license = "MIT"
repository = "https://github.com/your-org/docling-rs"
description = "Native Rust document processing library"

[workspace.dependencies]
# Core dependencies shared across crates
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
infer = "0.15"

# Chunking dependencies
tokenizers = "0.15"
unicode-segmentation = "1.11"

# Format-specific dependencies
pulldown-cmark = "0.9"
scraper = "0.17"
csv = "1.3"
docx-rs = "0.4"
calamine = "0.26"
pptx-to-md = "0.4"
tempfile = "3.8"

# PDF dependencies
pdfium-render = "0.8"
image = "0.25"
rusty-tesseract = "1.1"

# CLI dependencies
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
anyhow = "1.0"

# Dev dependencies
assert_cmd = "2.0"
predicates = "3.0"
printpdf = "0.7"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
panic = "deny"
