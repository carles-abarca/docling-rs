name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin -p docling-rs-cli

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin -p docling-rs-cli

      - name: Create Universal Binary
        run: |
          mkdir -p dist/docling-rs.app/Contents/{MacOS,Frameworks,Resources}

          # Create universal binary
          lipo -create \
            target/x86_64-apple-darwin/release/docling-rs \
            target/aarch64-apple-darwin/release/docling-rs \
            -output dist/docling-rs.app/Contents/MacOS/docling-rs

          # Match both architectures of the universal executable.
          lipo -create pdfium/lib/macos-arm64/libpdfium.dylib \
            pdfium/lib/macos-x64/libpdfium.dylib \
            -output dist/docling-rs.app/Contents/Frameworks/libpdfium.dylib
          lipo dist/docling-rs.app/Contents/Frameworks/libpdfium.dylib -verify_arch arm64 x86_64
          codesign --force --sign - dist/docling-rs.app/Contents/Frameworks/libpdfium.dylib

          # Create Info.plist
          VERSION="${{ env.RELEASE_TAG }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          cat > dist/docling-rs.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>docling-rs</string>
            <key>CFBundleDisplayName</key>
            <string>docling-rs</string>
            <key>CFBundleExecutable</key>
            <string>docling-rs</string>
            <key>CFBundleIdentifier</key>
            <string>com.docling-rs.cli</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Test bundled PDFium on native macOS
        env:
          DOCLING_TEST_PDFIUM: ${{ github.workspace }}/dist/docling-rs.app/Contents/Frameworks/libpdfium.dylib
        run: |
          cargo test -p docling-rs --test fidelity_regressions_105 -- --include-ignored
          dist/docling-rs.app/Contents/MacOS/docling-rs crates/docling-rs/tests/fixtures/attachments/text.pdf --to text --output-dir smoke-output
          grep -q FINAL_DOCUMENTO smoke-output/text.txt

      - name: Create DMG
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          VERSION="${VERSION#v}"

          # Create a temporary directory for DMG contents
          mkdir -p dmg-contents
          cp -R dist/docling-rs.app dmg-contents/

          # Also include standalone CLI binary
          mkdir -p dmg-contents/bin
          cp dist/docling-rs.app/Contents/MacOS/docling-rs dmg-contents/bin/
          if [ -f dist/docling-rs.app/Contents/Frameworks/libpdfium.dylib ]; then
            cp dist/docling-rs.app/Contents/Frameworks/libpdfium.dylib dmg-contents/bin/
          fi

          # Include documentation manual
          if [ -d manual ]; then
            cp -R manual dmg-contents/
          fi

          # Include README
          cp README.md dmg-contents/

          # Create DMG
          hdiutil create -volname "docling-rs ${VERSION}" \
            -srcfolder dmg-contents \
            -ov -format UDZO \
            docling-rs-${VERSION}-universal.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: docling-rs-*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release -p docling-rs-cli

      - name: Prepare distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/docling-rs.exe dist/
          if (Test-Path pdfium/lib/windows-x64/pdfium.dll) {
            Copy-Item pdfium/lib/windows-x64/pdfium.dll dist/
          }

      - name: Test bundled PDFium on Windows
        env:
          DOCLING_TEST_PDFIUM: ${{ github.workspace }}/dist/pdfium.dll
        run: |
          cargo test -p docling-rs --test fidelity_regressions_105 -- --include-ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./dist/docling-rs.exe crates/docling-rs/tests/fixtures/attachments/text.pdf --to text --output-dir smoke-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path smoke-output/text.txt -Pattern FINAL_DOCUMENTO -Quiet)) { throw "PDF smoke output missing" }

      - name: Create ZIP distribution
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}" -replace '^v', ''
          # Include documentation manual
          if (Test-Path manual) {
            Copy-Item -Recurse manual dist/
          }
          # Include README
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "docling-rs-${version}-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: docling-rs-*-windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release -p docling-rs-cli

      - name: Prepare distribution
        run: |
          mkdir -p dist
          cp target/release/docling-rs dist/
          if [ -f pdfium/lib/linux-x64/libpdfium.so ]; then
            cp pdfium/lib/linux-x64/libpdfium.so dist/
          fi

      - name: Install pinned Linux PDFium and test
        env:
          DOCLING_TEST_PDFIUM: ${{ github.workspace }}/dist/libpdfium.so
        run: |
          curl --fail --location --retry 3 -o pdfium-linux.tgz https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7350/pdfium-linux-x64.tgz
          echo '5a53c802a970d7d1414c0d2fdd8a0900e239b3e7e4eff7a5ddcbd433322606f2  pdfium-linux.tgz' | sha256sum --check
          mkdir pdfium-linux
          tar -xzf pdfium-linux.tgz -C pdfium-linux
          cp pdfium-linux/lib/libpdfium.so dist/
          cp -R pdfium-linux/LICENSE* dist/
          cp -R pdfium-linux/licenses dist/pdfium-licenses
          cargo test -p docling-rs --test fidelity_regressions_105 -- --include-ignored
          dist/docling-rs crates/docling-rs/tests/fixtures/attachments/text.pdf --to text --output-dir smoke-output
          grep -q FINAL_DOCUMENTO smoke-output/text.txt

      - name: Create tarball
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          VERSION="${VERSION#v}"
          # Include documentation manual
          if [ -d manual ]; then
            cp -R manual dist/
          fi
          # Include README
          cp README.md dist/
          tar -czvf docling-rs-${VERSION}-linux-x64.tar.gz -C dist .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: docling-rs-*-linux-x64.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: find . -type f -name "docling-rs-*"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            macos-dmg/*.dmg
            windows-zip/*.zip
            linux-tarball/*.tar.gz
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
